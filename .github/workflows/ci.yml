name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kontrol:
    name: lint · analyse · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tikmarka_test
          POSTGRES_USER: tikmarka
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tikmarka -d tikmarka_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: PHP 8.4 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip
          coverage: none

      - name: Node 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Bağımlılıkları kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ortam dosyasını hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Uzantıları kur
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U tikmarka -d tikmarka_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Biçim denetimi (Pint)
        run: bash .github/ci-kontrol.sh "pint" composer lint:check

      - name: Statik analiz (Larastan, seviye 8)
        if: always()
        run: bash .github/ci-kontrol.sh "larastan" composer analyse

      - name: Testler (Pest)
        if: always()
        run: bash .github/ci-kontrol.sh "pest" composer test

      - name: Panel derlemesi (Vite)
        if: always()
        run: bash .github/ci-kontrol.sh "vite" sh -c "npm ci && npm run build"

; ─────────────────────────────────────────────────────────────────────
; YÜKLEME SINIRLARI (4.6AA)
;
; ⚠️ ÖLÇÜLDÜ: doğrulama kuralı `max:5120` (5 MB) diyordu ama PHP'nin
; varsayılanı `upload_max_filesize = 2M`. Arada kalan dosya Laravel'e HİÇ
; ULAŞMIYOR — kural konuşamıyor, PHP kesiyor. Marka ekranda ham anahtar
; görüyordu: `validation.uploaded`.
;
; Sınır kuraldan YÜKSEK tutuluyor ki reddi Laravel versin: mesajı Türkçe
; ve alan adıyla söyleyen taraf o.
upload_max_filesize = 8M

; ⚠️ `post_max_size` yükleme sınırından BÜYÜK olmalı: gövdede dosyanın
; yanında form alanları da var. Eşit olsaydı tam sınırdaki dosya, üstüne
; birkaç bayt alan eklendiği için reddedilirdi.
post_max_size = 12M

; ⚠️ GD görseli BELLEKTE AÇIYOR: 4000×3000 bir fotoğraf sıkıştırılmış
; hâlde 5 MB ama açıldığında ~48 MB. Varsayılan 128M ile dönüştürme
; sırasında ikinci bir kopya açılınca sınır zorlanıyordu.
;
; ⚠️ Bu sınır SINIRSIZ DEĞİL ve olmamalı: `ImageOptimizer` ayrıca PİKSEL
; TAVANI uyguluyor (sıkıştırma bombası koruması) — küçük bir dosya
; gigabaytlarca belleğe açılabilir.
memory_limit = 256M

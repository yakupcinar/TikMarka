# Loki — günlük deposu. (B6)
#
# ⚠️ `auth_enabled: false` "giriş kapalı" DEĞİL, "giriş diye bir şey yok"
#    demektir. Loki'ye ağdan ulaşabilen herkes BÜTÜN markaların bütün
#    günlüklerini okur. Bu yüzden `docker-compose.yml`'de bu servise
#    `ports:` YAZILMIYOR — yalnızca Docker ağının içinden erişilebilir.
#    Ayarın gerçek anlamı çok kiracılık: `true` olsaydı her istek
#    `X-Scope-OrgID` başlığı isterdi. Bugün gerekmiyor; markaya kendi
#    günlüğü gösterilmek istendiği gün açılacak olan kapı budur.
auth_enabled: false

server:
  http_listen_port: 3100
  # Kendi günlüğü sessiz kalsın — toplayıcının topladığı şeye karışmasın.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # ⚠️ SAKLAMA SÜRESİ — insan günlüğüyle AYNI (14 gün · 336 saat).
  # Konmasaydı 72 MB problemi yeni bir yerde geri gelirdi: Loki
  # varsayılanda hiçbir şeyi silmiyor.
  retention_period: 336h

  # Toplayıcı yeniden başladığında biraz geçmiş gönderebiliyor;
  # reddedilirse o satırlar SESSİZCE kaybolur.
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  # ⚠️ `retention_period` TEK BAŞINA YETMEZ — silme işini compactor
  # yapıyor ve bu bayrak olmadan süre dolsa bile hiçbir şey silinmez.
  retention_enabled: true
  delete_request_store: filesystem

services:

  caddy:
    image: caddy:2-alpine
    environment:
      FPM_HOST: ${FPM_HOST:-app}
      FPM_PORT: ${FPM_PORT:-9000}

      NGROK_DOMAIN: ${NGROK_DOMAIN:-tunel-kapali.invalid}

      GOZLEM_DOMAIN: ${GOZLEM_DOMAIN:-gozlem.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data          # ⚠ sertifikalar burada — kalıcı olmalı (M-4.1/2)
      - caddy_config:/config

      # Erişim günlüğü DOSYAYA yazılıyor (B6): toplayıcı Docker soketi
      # bağlamadan okuyabilsin diye. Ayrıntı `docker/alloy/config.alloy`.
      - caddy_logs:/var/log/caddy
    depends_on:
      - app

  # ── Uygulama (PHP-FPM) ─────────────────────────────────────────────
  app:
    build: ./docker/php
    volumes:
      - .:/var/www/html 

      - ./docker/php/tikmarka.ini:/usr/local/etc/php/conf.d/tikmarka.ini:ro

      - node_modules:/var/www/html/node_modules

      - blade_cache:/var/www/html/storage/framework/views

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Kuyruk işçisi ──────────────────────────────────────────────────
  worker:
    build: ./docker/php
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www/html           # ⚠ app ile aynı bağlama — storage/ ortak (M-2.4)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Zamanlayıcı ────────────────────────────────────────────────────
  scheduler:
    build: ./docker/php
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Veritabanı ─────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tikmarka}
      POSTGRES_USER: ${DB_USERNAME:-tikmarka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"               # dışarıdan GUI ile bakabilmek için
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikmarka -d tikmarka"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Cache + kuyruk ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # ── Yerel e-posta yakalayıcı ───────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # ── ngrok tüneli — YALNIZCA ödeme sağlayıcısı testi için (1E-K10) ──
  # ── Gözlemlenebilirlik (B6) — `--profile gozlem` ───────────────────
  #
  # ⚠️ YALNIZCA TOPLAYICI — Loki ve Grafana ARTIK YEREL DEĞİL (B6.1).
  #    Günlükler Grafana Cloud'a gönderiliyor; arayüz de orada.
  #    Kazanç ölçüldü: ~400 MB yerine ~100 MB, ve arayüz için Caddy
  #    bloğu/alt alan adı gerekmiyor.
  #
  # ⚠️ `ports:` YOK: toplayıcının dışarıdan erişilmesi gereken hiçbir
  #    yüzeyi yok, tek yönü giden trafik.

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: ["gozlem"]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # ⚠️ İKİSİ DE SALT-OKUNUR ve Docker soketi YOK — gerekçesi
      #    `config.alloy`'un başında.
      - ./storage/logs:/logs:ro
      - caddy_logs:/caddy-logs:ro

      - alloy_data:/var/lib/alloy
    environment:
      # ⚠️ `:?` İLE ZORUNLU — jeton yoksa compose HATA VERİP DURUYOR.
      #    Varsayılan bırakılsaydı toplayıcı sessizce hiçbir yere
      #    gönderemeyen bir hâlde ayağa kalkar ve günlükler kaybolurdu;
      #    üstelik bu HATA VERMEZDİ, sadece Grafana boş görünürdü.
      LOKI_URL: ${LOKI_URL:?Grafana Cloud Loki push adresi .env'de tanimli olmali}
      LOKI_KULLANICI: ${LOKI_KULLANICI:?Grafana Cloud kullanici numarasi .env'de tanimli olmali}
      LOKI_TOKEN: ${LOKI_TOKEN:?Grafana Cloud API jetonu .env'de tanimli olmali}

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunel"]
    command: http --url=${NGROK_DOMAIN} --host-header=${NGROK_DOMAIN} caddy:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - caddy

volumes:
  blade_cache:
  caddy_logs:
  alloy_data:
  node_modules:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
